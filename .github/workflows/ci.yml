name: CI — Build, Test & Docker

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================
  # BUILD & DEPLOY JOB
  # Ansvar: Allt från kompilering till Azure-publicering
  # ============================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Krävs för OIDC-inloggning mot Azure
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: The-Snaxers/Dockerfile
          push: false
          load: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            thesnaxers:latest
            thesnaxers:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and responds
        run: |
          docker run -d --name snaxers-smoke -p 8080:8080 \
            -e CosmosDb__AccountEndpoint=https://localhost:8081/ \
            -e CosmosDb__AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw== \
            -e CosmosDb__DatabaseName=test \
            -e CosmosDb__ContainerName=test \
            -e CosmosDb__FavoritesContainerName=test \
            -e CosmosDb__CartContainerName=test \
            thesnaxers:${{ github.sha }}
          curl --fail --max-time 30 --retry 6 --retry-delay 5 --retry-all-errors \
            http://localhost:8080/health/live
          docker stop snaxers-smoke && docker rm snaxers-smoke

      # ============================================================
      # DEPLOY STEPS
      # Körs endast på main eller develop
      # ============================================================
      - name: Sign in to Azure (OIDC)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # P2-fix: Beräkna miljönamn och resurser från branch-namn
      - name: Set environment config
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "VAULT_NAME=kv-snaxers-prod" >> $GITHUB_ENV
            echo "ACR_NAME=acrsnaxersprod" >> $GITHUB_ENV
            echo "CONTAINER_APP=ca-snaxers-prod" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-snaxers-prod" >> $GITHUB_ENV
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "VAULT_NAME=kv-snaxers-dev" >> $GITHUB_ENV
            echo "ACR_NAME=acrsnaxersdev" >> $GITHUB_ENV
            echo "CONTAINER_APP=ca-snaxers-dev" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-snaxers-dev" >> $GITHUB_ENV
          fi

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Push image to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          docker tag thesnaxers:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/thesnaxers:${{ github.sha }}
          docker tag thesnaxers:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/thesnaxers:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/thesnaxers:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/thesnaxers:latest

      # P1-fix: Seed Key Vault INNAN appen deployas så att
      # nya revisioner startar med korrekta hemligheter
      - name: Seed Key Vault secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          # Admin-credentials (obligatoriska)
          az keyvault secret set \
            --vault-name ${{ env.VAULT_NAME }} \
            --name "AdminSettings--Email" \
            --value "${{ secrets.ADMIN_EMAIL }}" \
            --output none

          az keyvault secret set \
            --vault-name ${{ env.VAULT_NAME }} \
            --name "AdminSettings--Password" \
            --value "${{ secrets.ADMIN_PASSWORD }}" \
            --output none

          # JWT Secret (obligatorisk)
          az keyvault secret set \
            --vault-name ${{ env.VAULT_NAME }} \
            --name "Jwt--Secret" \
            --value "${{ secrets.JWT_SECRET }}" \
            --output none

          # Google OAuth (valfritt — sätts bara om secrets finns)
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            az keyvault secret set \
              --vault-name ${{ env.VAULT_NAME }} \
              --name "Authentication--Google--ClientId" \
              --value "${{ secrets.GOOGLE_CLIENT_ID }}" \
              --output none

            az keyvault secret set \
              --vault-name ${{ env.VAULT_NAME }} \
              --name "Authentication--Google--ClientSecret" \
              --value "${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              --output none
          fi

      - name: Deploy to Container App
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/thesnaxers:${{ github.sha }}